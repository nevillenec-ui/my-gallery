<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R2 Picviewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #111; color: #eee; font-family: sans-serif; }
    
    /* 顶部按钮区 */
    .header { display: flex; justify-content: center; gap: 15px; padding: 20px 0; }
    button { background: #333; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 14px; transition: 0.3s;}
    button:hover { background: #555; }
    button:disabled { background: #222; color: #666; cursor: not-allowed; }

    /* 图片网格区 */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 0 20px 40px; }
    .grid img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 8px; background: #222; transition: transform 0.3s; cursor: pointer; }
    .grid img:hover { transform: scale(1.05); }
    
    /* 加载状态 */
    .loading { text-align: center; padding: 40px; color: #888; }
  </style>
</head>
<body>

  <div class="header">
    <button id="prev" disabled>Previous</button>
    <button id="next">Next</button>
  </div>
  <div class="grid" id="grid"></div>

  <script>
    let cursorStack = [];
    let currentCursor = null;

   // ================= 复制从这里开始 =================
async function loadPage(cursor) {
    const grid = document.getElementById("grid");
    grid.innerHTML = "<div class='loading'>正在加载图片...</div>"; 

    try {
        const params = new URLSearchParams({ limit: 24 });
        if (cursor) params.set("cursor", cursor);

        const res = await fetch('https://imgview-x7j.pages.dev/api/list?' + params.toString());
        
        if (!res.ok) {
            throw new Error(`API 请求失败，状态码: ${res.status}`);
        }
        const data = await res.json(); 

        grid.innerHTML = ""; 

        if (!data.images || data.images.length === 0) {
            grid.innerHTML = "<div class='loading'>没有更多图片了。</div>";
            return;
        }

        // 渲染图片
        for (const img of data.images) {
            const imgEl = document.createElement("img");
            imgEl.src = img.url;
            imgEl.alt = img.key;
            imgEl.style.width = "100%";
            imgEl.style.borderRadius = "8px";
            imgEl.style.objectFit = "cover";
            imgEl.style.aspectRatio = "1";
            
            grid.appendChild(imgEl);
        }
        
        // 保存当前分页状态
        if (data.truncated) {
            currentCursor = data.cursor;
        } else {
            currentCursor = null;
        }

    } catch (err) {
        console.error(err);
        grid.innerHTML = `<div class='loading' style='color:red'>加载失败: ${err.message}</div>`;
    }
}
// ================= 复制到这里结束 =================

    // 下一页按钮
    document.getElementById("next").addEventListener("click", () => {
      if (!currentCursor) return;
      cursorStack.push(currentCursor);
      loadPage(currentCursor);
    });

    // 上一页按钮
    document.getElementById("prev").addEventListener("click", () => {
      if (cursorStack.length === 0) return;
      cursorStack.pop();
      const prevCursor = cursorStack.length > 0 ? cursorStack[cursorStack.length - 1] : null;
      loadPage(prevCursor);
    });

    // 初始加载
    loadPage(null);
  </script>
</body>
</html>
